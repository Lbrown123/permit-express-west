<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Permit Express West — Business for Sale</title>
  <meta name="description" content="Permit Express West is a business for sale. Interested or industry knowledgeable? Call Tim at 563.590.5288.">
  <style>
    :root {
      --bg: #f5f3ee;
      --ink: #1c1f24;
      --muted: #5b6168;
      --accent: #b8471f;
      --rule: #d9d4c9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171a;
        --ink: #f1efe9;
        --muted: #a3a8ae;
        --accent: #e8743f;
        --rule: #2c3035;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 720px; width: 100%; }
    .domain {
      font-size: clamp(1rem, 3vw, 1.25rem);
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2.5rem, 10vw, 5.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-transform: uppercase;
    }
    hr {
      border: 0;
      border-top: 2px solid var(--rule);
      width: 80px;
      margin: 2rem auto;
    }
    .who {
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .call {
      display: inline-block;
      font-size: clamp(1.25rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border: 3px solid var(--ink);
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .call:hover, .call:focus-visible {
      background: var(--ink);
      color: var(--bg);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="domain">Permit Express West</p>
    <h1>Business for Sale</h1>
    <hr>
    <p class="who">Interested / Industry Knowledgeable</p>
    <a class="call" href="tel:+15635905288">Call Tim at 563.590.5288</a>
  </main>
</body>
</html>
